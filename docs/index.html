<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Message Receiver</title>
    <style>
      html, body { min-height: 100%; margin: 0; }
      body {
        background: #f8f7f4;
        color: #1e1e2a;
        font-family: system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-gutter: stable;
      }
      main {
        max-width: 48rem;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      header { text-align: center; margin-bottom: 1.5rem; }
      header h1 { margin: 0 0 0.4rem; font-size: 1.6rem; font-weight: 700; color: #1a1a2e; }
      header p { margin: 0; font-size: 0.95rem; color: #5a5a72; }
      #message-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #message-list li {
        background: #ffffff;
        border: 1px solid #e4e2ec;
        border-radius: 0.85rem;
        padding: 0.7rem 0.9rem;
        margin-bottom: 0.6rem;
      }
      /* Block layout (no flexbox) so each field sits on its own line. */
      #message-list li .time {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #7a7a92;
      }
      #message-list li .origin {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #7a7a92;
        margin-bottom: 0.4rem;
      }
      #message-list li .data {
        display: block;
        font-size: 0.95rem;
        color: #1a1a2e;
        word-break: break-word;
        white-space: pre-wrap;
        border-top: 1px solid #eee;
        padding-top: 0.4rem;
      }
      #empty-note {
        text-align: center;
        color: #a0a0b8;
        font-size: 0.9rem;
        padding: 2rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Received Messages</h1>
        <p>Messages posted to this window via <code>postMessage()</code> appear below.</p>
      </header>
      <ul id="message-list"></ul>
      <div id="empty-note">No messages yet.</div>
    </main>

    <script>
      var listEl = document.getElementById("message-list");
      var emptyNote = document.getElementById("empty-note");

      function renderMessage(data, origin) {
        var li = document.createElement("li");

        var time = document.createElement("span");
        time.className = "time";
        time.textContent = new Date().toLocaleTimeString();

        var originEl = document.createElement("span");
        originEl.className = "origin";
        originEl.textContent = "from " + origin;

        var dataEl = document.createElement("span");
        dataEl.className = "data";
        if (typeof data === "string") {
          dataEl.textContent = data;
        } else {
          try {
            dataEl.textContent = JSON.stringify(data, null, 2);
          } catch (e) {
            dataEl.textContent = String(data);
          }
        }

        li.appendChild(time);
        li.appendChild(originEl);
        li.appendChild(dataEl);
        listEl.appendChild(li);
      }

      window.addEventListener("message", function(e) {
        if (emptyNote) {
          emptyNote.parentNode.removeChild(emptyNote);
          emptyNote = null;
        }
        renderMessage(e.data, e.origin);
      });
    </script>
  </body>
</html>
